{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-sm text-center" style="border-radius:14px; border:none;">

            <div class="mb-3" style="font-size:2.5rem; color:#ef4444;">
                <i class="bi bi-trash3"></i>
            </div>

            <h5 class="fw-bold mb-1">Delete Expense?</h5>
            <p class="text-muted small mb-4">
                "<strong>{{ expense.title }}</strong>" — ₹{{ expense.amount }} on {{ expense.date }}<br>
                This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash3 me-1"></i> Delete
                    </button>
                    <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
