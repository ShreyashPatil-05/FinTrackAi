{% extends "base.html" %}
{% load static %}
{% load fintrack_filters %}

{% block content %}

<!-- Page Header — static, never swapped -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
        <h4 class="fw-bold mb-0">Expenses</h4>
        <span class="text-muted" style="font-size:0.82rem;">Track and manage your spending</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="el-view-toggle" id="viewToggle">
            <button class="el-view-btn active" id="btnTable" onclick="setView('table')" title="Table view">
                <i class="bi bi-list-ul"></i>
            </button>
            <button class="el-view-btn" id="btnCard" onclick="setView('card')" title="Card view">
                <i class="bi bi-grid-3x3-gap"></i>
            </button>
        </div>
        <a href="{% url 'add_expense' %}" class="el-btn-add">
            <i class="bi bi-plus-lg me-1"></i> Add Expense
        </a>
    </div>
</div>

<!-- ── AJAX-swappable region — filter bar + list both inside ── -->
<div id="expenseListRegion">
    {% include "expenses/partials/expense_list_partial.html" %}
</div>

<!-- Loading overlay -->
<div id="elLoadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,0.55);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:12px;padding:18px 28px;box-shadow:0 4px 24px rgba(0,0,0,0.12);display:flex;align-items:center;gap:12px;font-size:0.9rem;color:#475569;">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        Loading…
    </div>
</div>

<form id="bulkDeleteForm" method="post" action="{% url 'bulk_delete_expenses' %}" style="display:none;">
    {% csrf_token %}
    <div id="bulkDeleteInputs"></div>
</form>

<script src="{% static 'js/expense_list.js' %}"></script>

{% endblock %}
