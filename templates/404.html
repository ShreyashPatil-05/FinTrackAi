{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | FinTrack</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    .err-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2, #f8fafc);
      padding: 2rem;
    }
    .err-card {
      background: var(--card, #fff);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(99,102,241,0.10);
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 460px;
      width: 100%;
    }
    .err-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .err-icon {
      font-size: 3rem;
      color: #6366f1;
      margin: 0.5rem 0 1rem;
      opacity: 0.7;
    }
    .err-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text, #1e293b);
      margin-bottom: 0.5rem;
    }
    .err-msg {
      color: var(--text-muted, #64748b);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .err-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .err-btn:hover { opacity: 0.88; color: #fff; }
    .err-links {
      margin-top: 1.2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .err-link {
      font-size: 0.85rem;
      color: #6366f1;
      text-decoration: none;
    }
    .err-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="err-page">
    <div class="err-card">
      <div class="err-code">404</div>
      <div class="err-icon"><i class="bi bi-compass"></i></div>
      <h1 class="err-title">Page Not Found</h1>
      <p class="err-msg">The page you're looking for doesn't exist or may have been moved.</p>
      <a href="{% url 'landing' %}" class="err-btn">
        <i class="bi bi-house-fill"></i> Go Home
      </a>
      <div class="err-links">
        <a href="{% url 'expense_list' %}" class="err-link"><i class="bi bi-receipt me-1"></i>Expenses</a>
        <a href="{% url 'settings_income' %}" class="err-link"><i class="bi bi-gear me-1"></i>Settings</a>
        <a href="{% url 'savings_goals' %}" class="err-link"><i class="bi bi-piggy-bank me-1"></i>Savings</a>
      </div>
    </div>
  </div>
</body>
</html>
